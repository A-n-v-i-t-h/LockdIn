<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131313">
<title>Offline · LockdIn</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #131313; color: #eeeeea; font: 16px/1.5 system-ui, sans-serif; padding: 24px; }
  .box { max-width: 420px; display: grid; gap: 14px; }
  .hz { height: 10px; background: repeating-linear-gradient(-45deg, #e8b923 0 8px, #131313 8px 16px); }
  h1 { margin: 0; font: 800 34px/1 "Arial Narrow", Impact, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
  p { margin: 0; color: #b6b6b0; }
  button { justify-self: start; background: #e2463f; color: #fff; border: 0; padding: 12px 18px; font: 700 16px/1 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; }
</style>
</head>
<body>
  <main class="box">
    <div class="hz"></div>
    <h1>No signal</h1>
    <p>LockdIn needs a connection to load and save your log. Nothing you already saved is lost.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
